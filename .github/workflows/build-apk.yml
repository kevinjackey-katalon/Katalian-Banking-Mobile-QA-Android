name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the legacy "tools" package,
          # which sdkmanager can no longer find (exit code 1). Install only what exists;
          # platforms and build-tools are installed in the next step.
          packages: 'platform-tools'

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;36.0.0"
          # compileSdk 37. If the platform id differs, Android Gradle Plugin downloads it
          # itself (licenses are accepted above), so a miss here is not fatal.
          sdkmanager "platforms;android-37" || sdkmanager "platforms;android-37.0" || echo "Platform 37 not installed by name; AGP will fetch it."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.0

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Unit tests and release (R8) build check
        run: gradle testDebugUnitTest assembleRelease --no-daemon

      - name: Lint (informational)
        continue-on-error: true
        run: gradle lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Locate APK
        id: apk
        run: |
          # AGP 9's variant API can no longer rename outputs, so the friendly
          # user-facing filename is applied here instead of in the Gradle build.
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          mkdir -p dist
          cp "$SRC" "dist/Katalian Banking.apk"
          echo "path=dist/Katalian Banking.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v6
        with:
          name: katalian-banking-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Remove stale APK asset (if present)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete-asset apk-latest app-debug.apk -y || true

      - name: Publish/update GitHub Release with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Katalian Banking (Android) - Latest Debug APK"
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
