name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the legacy "tools" package,
          # which sdkmanager can no longer find (exit code 1). Install only what exists;
          # platforms and build-tools are installed in the next step.
          packages: 'platform-tools'

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.6
          arguments: assembleDebug --no-daemon

      - name: Unit tests and release (R8) build check
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.6
          arguments: testDebugUnitTest assembleRelease --no-daemon

      - name: Lint (informational)
        continue-on-error: true
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.6
          arguments: lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: katalian-banking-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Remove stale APK asset (if present)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete-asset apk-latest app-debug.apk -y || true

      - name: Publish/update GitHub Release with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Katalian Banking (Android) - Latest Debug APK"
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
